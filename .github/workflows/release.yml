name: Release Build

# 触发方式：
#   1) 在 GitHub 上发布（Publish）一个 Release 后自动编译各平台安装包并回传产物
#   2) 推送 v* tag（若该 tag 还没有 Release，会自动创建一个并附上安装包）
#   3) 手动 workflow_dispatch（可指定 tag，用于补构建 / 验证打包流程）
#
# 说明：字幕引擎由 PyInstaller 本机原生编译，无法交叉编译，
# 因此每个平台的安装包都在各自系统的 runner 上构建。

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（如 v2.0.1）；留空则取 package.json 的 version'
        required: false
        type: string
      dry_run:
        description: '仅构建并上传 workflow artifact，不写入 Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── 发布元信息：确定 tag / 版本，校验一致性，提取更新日志 ──────────────
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag / version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 版本不一致时（tag 与 package.json 不同步）直接失败，避免发布错误版本号的安装包
      - name: Release pre-flight check
        run: node scripts/prepare-release.mjs --tag "${{ steps.meta.outputs.tag }}" --notes-out release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # ── 各平台安装包编译 ────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: prepare
    # macOS Intel 上 llvmlite 需要从源码编译（无 x86_64 预编译包），耗时较长
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest # Apple Silicon
            platform: mac
            arch: arm64
          - os: macos-15-intel # Intel
            platform: mac
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # Linux arm64 需要 arm64 宿主（如 ubuntu-24.04-arm 或自托管 runner），
          # 确认 runner 可用后取消下面的注释即可。
          # - os: ubuntu-24.04-arm
          #   platform: linux
          #   arch: arm64

    runs-on: ${{ matrix.os }}

    env:
      # 未配置证书时显式关闭签名身份自动发现，走 ad-hoc 签名即可。
      # 注意：CSC_LINK / CSC_KEY_PASSWORD 不能在 job env 里“置空”——
      # electron-builder 会把空字符串当成证书文件路径（path.resolve('') == 项目目录），
      # 从而报 "… not a file"。因此证书只在下面确认 secret 存在时才导出。
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      # pyaudio（portaudio）与 llvmlite/numba 在 macOS 上需要本地库
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install portaudio
          # resampy -> numba -> llvmlite：无预编译 wheel 时需本地编译，必须能找到 llvm-config
          brew install llvm@20 || brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm@20 2>/dev/null || brew --prefix llvm)"
          # 注意：GITHUB_PATH / GITHUB_ENV 只对后续 step 生效，本 step 内必须使用完整路径
          "${LLVM_PREFIX}/bin/llvm-config" --version
          echo "LLVM_CONFIG=${LLVM_PREFIX}/bin/llvm-config" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup macOS code signing
        if: runner.os == 'macOS' && env.MAC_CERTIFICATE != ''
        run: |
          echo "CSC_LINK=${MAC_CERTIFICATE}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Python engine environment
        run: node scripts/setup-engine.mjs

      - name: Build and package
        # --publish never：产物由下面的 softprops 上传到 Release，
        # 否则 electron-builder 会因为检测到 tag 而尝试发布到 electron-builder.yml 里的占位地址
        run: node scripts/build-app.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiVoiceEars-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      # 仅在“推送 tag”触发时补齐 Release 正文（Release 已存在时不会覆写其正文）
      - name: Download release notes
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Attach artifacts to GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: false
          body_path: ${{ github.event_name == 'push' && 'release-notes.md' || '' }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
