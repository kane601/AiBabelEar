appId: com.himeditator.aibabelear
productName: AiBabelEar
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{LICENSE,README.md,README_en.md,README_ja.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!engine/*'
  - '!docs/*'
  - '!assets/*'
  - '!.repomap/*'
  - '!.virtualme/*'
# 说明：字幕引擎产物按平台分别在下方声明。
# 若放在顶层，Windows 构建时 ./engine/dist/main 不存在会导致 electron-builder 直接报错。
win:
  executableName: ai-babel-ear
  icon: build/icon.png
  extraResources:
    # 字幕引擎（Windows）
    - from: ./engine/dist/main.exe
      to: ./engine/main.exe
    # aria2 下载器：Windows 仅打包与构建架构匹配的二进制（x64 包只带 win/x64）
    - from: ./aria2/win/x64
      to: ./aria2/win/x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # 同时产出 dmg 与 zip（zip 为免安装版，也便于后续接入自动更新）
  target:
    - dmg
    - zip
  extraResources:
    # 字幕引擎（macOS）
    - from: ./engine/dist/main
      to: ./engine/main
    # aria2 下载器：macOS 打包 arm64 / x86_64 两个子目录（运行时按 process.arch 选择）
    - from: ./aria2/mac
      to: ./aria2/mac
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    # - AppImage
    # - snap
    # - deb
    - tar.gz
  maintainer: electronjs.org
  category: Utility
  extraResources:
    # 字幕引擎（Linux）
    - from: ./engine/dist/main
      to: ./engine/main
    # aria2 下载器
    - from: ./aria2/linux
      to: ./aria2/linux
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
