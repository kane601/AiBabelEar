<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AiBabelEar">
  <title>AiBabelEar</title>
  <defs>
    <!-- 用遮罩把「线框地球」与「字幕条」从耳形中挖空，与位图版的负形保持一致 -->
    <mask id="abeKnockout" maskUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712">
      <rect x="-100" y="-100" width="712" height="712" fill="#ffffff" />
      <!-- 线框地球：多语言 / Babel -->
      <g fill="none" stroke="#000000" stroke-linecap="round">
        <circle cx="316" cy="178" r="46" stroke-width="10" />
        <ellipse cx="316" cy="178" rx="19" ry="46" stroke-width="8" />
        <path d="M270 178h92" stroke-width="8" />
      </g>
      <!-- 字幕条：实时字幕 -->
      <g fill="#000000">
        <rect x="256" y="298" width="124" height="26" rx="13" />
        <rect x="256" y="344" width="80" height="26" rx="13" />
      </g>
    </mask>
  </defs>
  <!-- 耳形主体（扁平、粗轮廓，主色 #6938B9）；translate 让整体在画布内居中 -->
  <g transform="translate(-79,13)">
    <path
      fill="#6938B9"
      mask="url(#abeKnockout)"
      d="M300 60
         C378 60 434 118 436 196
         C438 244 424 286 406 320
         C392 350 376 384 358 404
         C344 420 326 428 308 422
         C292 416 280 402 268 386
         C246 356 232 326 232 292
         C232 256 250 230 272 216
         C294 202 306 184 308 160
         C311 124 312 88 300 60 Z"
    />
  </g>
</svg>
